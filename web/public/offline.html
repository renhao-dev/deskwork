<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskwork</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: #3e5a4d; font: 15px/1.5 system-ui, sans-serif; color: #1e2a2a; }
  .card { max-width: 380px; padding: 28px; border-radius: 12px; background: #f6f7f2; box-shadow: 0 20px 50px -18px rgba(0,0,0,.6); }
  h1 { margin: 0 0 8px; font-size: 21px; }
  p { margin: 0 0 10px; color: #46534e; }
  code { background: #eceee6; padding: 1px 5px; border-radius: 4px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1d2923; color: #e5e9e2; }
    .card { background: #252e2a; } p { color: #bcc5bd; } code { background: #1e2622; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>The Deskwork server isn't running</h1>
    <p>Your data is safe. This page reconnects by itself as soon as the server is back.</p>
    <p>It starts by itself when you log in. To start it now, run <code>scripts/start.sh</code> in the Deskwork project folder.</p>
  </div>
  <script>
    setInterval(() => fetch('/api/health', { cache: 'no-store' }).then((r) => r.ok && location.reload()).catch(() => {}), 3000)
  </script>
</body>
</html>
